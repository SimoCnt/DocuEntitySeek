server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI inference is synchronous in the current portfolio build.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    location = /docs { proxy_pass http://backend:8000; }
    location = /redoc { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }

    # React Router fallback for refreshes on /documents, /schemas, /premium, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }

        try_files $uri =404;
    }
}
